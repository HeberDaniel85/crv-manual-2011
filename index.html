<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Manual Honda CR-V 2011 (2.4L)</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      height: 100vh;
      background: #212529;
      color: #333;
    }

    /* BARRA LATERAL */
    #sidebar {
      width: 380px;
      min-width: 320px;
      background: #ffffff;
      border-right: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
      padding: 15px;
      z-index: 2;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 1.15rem;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #search {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #search:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
    }
    #count {
      font-size: 12px;
      color: #6c757d;
      margin-bottom: 12px;
    }
    #results {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    /* ELEMENTO DE RESULTADO */
    .item {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
      background: #f8f9fa;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .item:hover {
      background: #e7f1ff;
      border-color: #b6d4fe;
    }
    .item.active {
      background: #0d6efd;
      color: #ffffff;
      border-color: #0d6efd;
    }
    .item.active span {
      color: #e9ecef !important;
    }
    .item strong {
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
    }
    .item span {
      font-size: 11px;
      color: #6c757d;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    /* ÁREA PRINCIPAL / VISOR */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #1e293b;
    }
    #topbar {
      background: #0f172a;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    #page-title {
      font-size: 14px;
      font-weight: 600;
    }
    .nav-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      margin-left: 6px;
      transition: background 0.15s;
    }
    .nav-btn:hover {
      background: #475569;
    }

    #viewer-container {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 25px;
    }
    #manual-img {
      max-width: 90%;
      height: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Barra lateral -->
  <div id="sidebar">
    <h2>🚗 Manual CR-V 2011</h2>
    <input type="text" id="search" placeholder="Escribe en español o inglés (ej. bomba de agua)...">
    <div id="count">Cargando índice técnico...</div>
    <div id="results"></div>
  </div>

  <!-- Área de visualización -->
  <div id="main">
    <div id="topbar">
      <span id="page-title">Selecciona una página</span>
      <div>
        <button class="nav-btn" onclick="cambiarPagina(-1)">◀ Anterior</button>
        <button class="nav-btn" onclick="cambiarPagina(1)">Siguiente ▶</button>
      </div>
    </div>
    <div id="viewer-container">
      <img id="manual-img" src="" style="display:none;" alt="Página del Manual">
    </div>
  </div>

  <script>
    let paginas = [];
    let paginaActualNum = 239; // Bomba de agua por defecto

    // Diccionario de equivalencias Español -> Inglés de taller
    const sinonimos = {
      "bomba de agua": "water pump",
      "bomba agua": "water pump",
      "termostato": "thermostat",
      "refrigerante": "coolant",
      "anticongelante": "coolant",
      "radiador": "radiator",
      "ventilador": "fan",
      "ventiladores": "fan shroud",
      "banda": "drive belt",
      "correa": "drive belt",
      "faja": "drive belt",
      "tensor": "auto-tensioner",
      "polea tensora": "tensioner pulley",
      "alternador": "alternator",
      "arranque": "starter",
      "motor de arranque": "starter",
      "bujia": "spark plug",
      "bujias": "spark plug",
      "bobina": "ignition coil",
      "bobinas": "ignition coil",
      "cadena de tiempo": "cam chain",
      "cadena tiempo": "cam chain",
      "cadena": "cam chain",
      "direccion": "power steering",
      "bomba de direccion": "power steering pump",
      "cremallera": "steering gearbox",
      "freno": "brake",
      "frenos": "brakes",
      "pastillas": "brake pad",
      "disco": "brake disc",
      "caliper": "caliper",
      "aceite": "oil",
      "bomba de aceite": "oil pump",
      "filtro de aceite": "oil filter",
      "caja": "transmission",
      "transmision": "automatic transmission",
      "aceite de caja": "atf",
      "amortiguador": "damper",
      "amortiguadores": "strut",
      "suspension": "suspension",
      "muñon": "knuckle",
      "rotula": "ball joint",
      "escape": "exhaust",
      "catalizador": "catalytic converter",
      "admision": "intake manifold",
      "cuerpo de aceleracion": "throttle body",
      "valvula": "valve",
      "culata": "cylinder head",
      "torque": "torque",
      "fusible": "fuse",
      "fusibles": "fuse"
    };

    // Cargar indice_crv.json generado en C#
    fetch('indice_crv.json')
      .then(response => {
        if (!response.ok) throw new Error('No se pudo encontrar indice_crv.json');
        return response.json();
      })
      .then(data => {
        paginas = data;
        document.getElementById('count').textContent = `Total: ${paginas.length} páginas indexadas`;
        renderLista(paginas.slice(0, 50));
        mostrarPagina(paginaActualNum);
      })
      .catch(error => {
        document.getElementById('count').textContent = 'Error: Asegúrate de abrir con "Live Server" en VS Code.';
        console.error(error);
      });

    const searchInput = document.getElementById('search');
    const resultsContainer = document.getElementById('results');

    searchInput.addEventListener('input', (e) => {
      let query = e.target.value.toLowerCase().trim();
      if (!query) {
        renderLista(paginas.slice(0, 50));
        document.getElementById('count').textContent = `Mostrando primeras 50 de ${paginas.length} páginas`;
        return;
      }

      // Si el término existe en el diccionario, buscamos tanto en español como su traducción en inglés
      let traduccion = sinonimos[query] || "";

      const filtrados = paginas.filter(p => {
        const porNumero = p.Pagina.toString() === query;
        if (!p.Texto) return porNumero;

        const textoLower = p.Texto.toLowerCase();
        const coincideDirecto = textoLower.includes(query);
        const coincideIngles = traduccion ? textoLower.includes(traduccion) : false;

        return porNumero || coincideDirecto || coincideIngles;
      }).slice(0, 60);

      document.getElementById('count').textContent = `Coincidencias encontradas: ${filtrados.length}`;
      renderLista(filtrados);
    });

    function renderLista(lista) {
      resultsContainer.innerHTML = '';
      lista.forEach(p => {
        const div = document.createElement('div');
        div.className = `item ${p.Pagina === paginaActualNum ? 'active' : ''}`;
        div.id = `item-pag-${p.Pagina}`;
        div.innerHTML = `
          <strong>Página ${p.Pagina}</strong>
          <span>${p.Texto ? p.Texto.substring(0, 110) : 'Diagrama / Esquema gráfico'}...</span>
        `;
        div.onclick = () => mostrarPagina(p.Pagina);
        resultsContainer.appendChild(div);
      });
    }

    function mostrarPagina(num) {
      if (num < 1 || num > paginas.length) return;
      paginaActualNum = num;

      const pag = paginas.find(p => p.Pagina === num);
      if (!pag) return;

      document.getElementById('page-title').textContent = `Página ${pag.Pagina} de ${paginas.length}`;
      const img = document.getElementById('manual-img');
      img.src = pag.Imagen;
      img.style.display = 'block';

      // Resaltar en la barra lateral
      document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
      const elementoActivo = document.getElementById(`item-pag-${num}`);
      if (elementoActivo) {
        elementoActivo.classList.add('active');
        elementoActivo.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function cambiarPagina(delta) {
      mostrarPagina(paginaActualNum + delta);
    }
  </script>
</body>
</html>
