<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>CR-V 2011 - Información General (Sec. 1)</title>
  <style>
    :root {
      --bg-dark: #070913;
      --bg-surface: #0f172a;
      --bg-card: #1e293b;
      --bg-elevated: #334155;
      --gen-blue: #3b82f6;
      --gen-glow: rgba(59, 130, 246, 0.35);
      --cyan: #38bdf8;
      --emerald: #10b981;
      --amber: #f59e0b;
      --text-bright: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-bright);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* BARRA LATERAL / LISTA */
    #sidebar {
      width: 370px;
      min-width: 300px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 20;
      transition: transform 0.25s ease;
    }

    .brand-header {
      padding: 12px 16px;
      background: #020617;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: var(--gen-blue);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 4px;
      box-shadow: 0 0 10px var(--gen-glow);
    }
    .title h1 { font-size: 0.95rem; font-weight: 700; }
    .title p { font-size: 0.7rem; color: var(--text-muted); }

    .control-box {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-wrap { position: relative; }
    #search {
      width: 100%;
      padding: 9px 12px 9px 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .group-select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--cyan);
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }

    #list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-card {
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    .item-card.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--gen-blue);
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .item-sec { font-size: 0.82rem; font-weight: bold; color: var(--cyan); }
    .item-card.active .item-sec { color: var(--gen-blue); }
    .item-png { font-size: 0.65rem; background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; color: var(--text-muted); }
    .item-title { font-size: 0.8rem; font-weight: 600; margin-bottom: 2px; }
    .item-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.3; }

    /* VISOR */
    #main-viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #020617;
      position: relative;
    }
    #topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .topbar-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tool-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tool-btn.primary {
      background: var(--gen-blue);
      border-color: var(--gen-blue);
      color: #fff;
    }

    #stage {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
      background: #020617;
    }
    #sheet-img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      background: #fff;
      transform-origin: top center;
    }

    #toggle-list-btn {
      display: none;
      background: var(--gen-blue);
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      #sidebar {
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
      }
      #sidebar.hidden { transform: translateX(-100%); pointer-events: none; }
      #toggle-list-btn { display: inline-block; }
      #main-viewer { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- BARRA LATERAL -->
  <aside id="sidebar">
    <div class="brand-header">
      <div class="badge">GEN INFO</div>
      <div class="title">
        <h1>HONDA CR-V 2011</h1>
        <p>Información General de Taller (Sec. 1)</p>
      </div>
    </div>

    <div class="control-box">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" placeholder="Buscar VIN, pintura, remolque, rampa, gato, etiquetas...">
      </div>

      <select class="group-select" id="group-filter" onchange="filtrarGrupo(this.value)">
        <option value="ALL">📋 Toda la Información General</option>
        <option value="VIN_CODES">🆔 VIN, Motores, Cajas y Pintura</option>
        <option value="LIFT_JACK">🏗️ Puntos de Gato y Elevador de Taller</option>
        <option value="TOWING_4WD">🚛 Remolque y Precauciones Real-Time 4WD</option>
        <option value="LABELS_SAFETY">⚠️ Etiquetas de Seguridad y Advertencias</option>
      </select>
      <div style="font-size:0.7rem; color:var(--text-muted); display:flex; justify-content:space-between;">
        <span id="counter">0 láminas</span>
        <span id="zoom-label">Zoom: 100%</span>
      </div>
    </div>

    <div id="list-container"></div>
  </aside>

  <!-- ÁREA DE VISUALIZACIÓN -->
  <main id="main-viewer">
    <header id="topbar">
      <div class="topbar-info">
        <button id="toggle-list-btn" onclick="toggleSidebar(true)">☰ Menú General</button>
        <span id="sheet-title">Página 1-2</span>
        <a id="btn-raw" class="tool-btn primary" href="#" target="_blank">↗ Ver PNG</a>
      </div>
      <div class="toolbar">
        <button class="tool-btn" onclick="zoom(-0.2)">➖ Reducir</button>
        <button class="tool-btn" onclick="zoom(0.2)">➕ Ampliar</button>
        <button class="tool-btn" onclick="zoomReset()">⟲ 100%</button>
        <button class="tool-btn" onclick="nav(-1)">◀ Ant.</button>
        <button class="tool-btn" onclick="nav(1)">Sig. ▶</button>
      </div>
    </header>

    <div id="stage">
      <img id="sheet-img" src="" alt="Lámina Oficial de Información General Honda">
    </div>
  </main>

  <script>
    // BASE DE DATOS ESTRUCTURADA DE INFORMACIÓN GENERAL (SECCIÓN 1 COMPLETA)
    const infoGeneral = [
      { grupo: "VIN_CODES", sec: "1-1", pag: 3, titulo: "Índice de la Sección de Información General", desc: "Tabla de contenido: Códigos de chasis, ubicación de VIN, etiquetas, rampa, remolque y precauciones 4WD." },
      { grupo: "VIN_CODES", sec: "1-2", pag: 4, titulo: "Desglose de VIN, Códigos de Motor y Pintura", desc: "Estructura 5J6/JHL, modelo RE3 (2WD) / RE4 (4WD), motor K24Z1, cajas MZJA/MZHA y carta de colores de pintura." },
      { grupo: "VIN_CODES", sec: "1-3", pag: 5, titulo: "Ubicación de Números de Identificación", desc: "Placa del VIN en parabrisas, etiqueta en marco de puerta, estampado en monobloque y carcasa de transmisión." },
      { grupo: "LABELS_SAFETY", sec: "1-4", pag: 6, titulo: "Ubicación de Etiquetas de Seguridad y Alerta", desc: "Etiquetas en guantera (Airbag niños), columna de dirección, viseras (volcadura) y módulos laterales SRS." },
      { grupo: "LABELS_SAFETY", sec: "1-5", pag: 7, titulo: "Etiquetas de Marco de Puerta y Presión de Llantas", desc: "Etiqueta de control de emisiones, especificación de refrigerante, tapón de radiador y presión de neumáticos." },
      { grupo: "LABELS_SAFETY", sec: "1-6", pag: 8, titulo: "Etiqueta de Control de Emisiones Bajo Cofre", desc: "Identificación de familia de emisiones EPA Tier 2 Bin 5, familia evaporativa y grupo de prueba de motor." },
      { grupo: "LIFT_JACK", sec: "1-7", pag: 9, titulo: "Puntos de Levantamiento: Gato y Rampa de 2 Postes", desc: "Tacos de elevación en pestañas de estribo, soporte central de subchasis delantero y gancho central trasero." },
      { grupo: "TOWING_4WD", sec: "1-8", pag: 10, titulo: "Puntos de Sujeción y Arrastre en Plataforma", desc: "Ganchos delanteros (A), ranuras de amarre en bastidor (B), gancho trasero (C) y ranuras traseras (D)." },
      { grupo: "TOWING_4WD", sec: "1-9", pag: 11, titulo: "Protocolo de Remolque: Plataforma vs 2WD", desc: "4WD únicamente en plataforma. 2WD en emergencia: palanca D -> N, llave en ACC (I), máx 55 km/h por 80 km." },
      { grupo: "TOWING_4WD", sec: "1-10", pag: 12, titulo: "Marcado de Partes y Precauciones Real-Time 4WD", desc: "Etiquetas antirrobo con VIN. Sistema Dual Pump: para rodar ruedas en taller, elevar las 4 ruedas del suelo." }
    ];

    let itemsFiltrados = [...infoGeneral];
    let indiceActual = 0;
    let zoomLevel = 1.0;

    function renderLista() {
      const cont = document.getElementById('list-container');
      cont.innerHTML = '';
      document.getElementById('counter').textContent = `${itemsFiltrados.length} láminas técnicas`;

      itemsFiltrados.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `item-card ${idx === indiceActual ? 'active' : ''}`;
        div.id = `item-${idx}`;
        div.innerHTML = `
          <div class="item-top">
            <span class="item-sec">Sec. ${item.sec}</span>
            <span class="item-png">pag_${item.pag}.png</span>
          </div>
          <div class="item-title">${item.titulo}</div>
          <div class="item-desc">${item.desc}</div>
        `;
        div.onclick = () => {
          seleccionarItem(idx);
          toggleSidebar(false);
        };
        cont.appendChild(div);
      });
    }

    function seleccionarItem(idx) {
      if (idx < 0 || idx >= itemsFiltrados.length) return;
      indiceActual = idx;
      const item = itemsFiltrados[idx];

      document.getElementById('sheet-title').textContent = `Sec. ${item.sec} • Pág. ${item.pag}`;
      const img = document.getElementById('sheet-img');
      const rawUrl = `https://raw.githubusercontent.com/HeberDaniel85/crv-manual-2011/main/imagenes/pag_${item.pag}.png`;
      img.src = rawUrl;
      document.getElementById('btn-raw').href = rawUrl;

      document.querySelectorAll('.item-card').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`item-${idx}`);
      if (activeEl) {
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      zoomReset();
    }

    function nav(delta) {
      seleccionarItem(indiceActual + delta);
    }

    function zoom(delta) {
      zoomLevel = Math.max(0.6, Math.min(3.0, zoomLevel + delta));
      document.getElementById('sheet-img').style.transform = `scale(${zoomLevel})`;
      document.getElementById('zoom-label').textContent = `Zoom: ${Math.round(zoomLevel * 100)}%`;
    }

    function zoomReset() {
      zoomLevel = 1.0;
      document.getElementById('sheet-img').style.transform = `scale(1)`;
      document.getElementById('zoom-label').textContent = `Zoom: 100%`;
    }

    function toggleSidebar(show) {
      const sb = document.getElementById('sidebar');
      if (show) sb.classList.remove('hidden');
      else sb.classList.add('hidden');
    }

    function filtrarGrupo(sub) {
      if (sub === 'ALL') {
        itemsFiltrados = [...infoGeneral];
      } else {
        itemsFiltrados = infoGeneral.filter(i => i.grupo === sub);
      }
      indiceActual = 0;
      renderLista();
      seleccionarItem(0);
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        itemsFiltrados = [...infoGeneral];
      } else {
        itemsFiltrados = infoGeneral.filter(i => 
          i.sec.toLowerCase().includes(q) ||
          i.pag.toString() === q ||
          i.titulo.toLowerCase().includes(q) ||
          i.desc.toLowerCase().includes(q)
        );
      }
      indiceActual = 0;
      renderLista();
      if (itemsFiltrados.length > 0) seleccionarItem(0);
    });

    window.onload = () => {
      renderLista();
      // Abre por defecto en el desglose de VIN y pintura (Pág. 4 / Sec. 1-2)
      const initIdx = infoGeneral.findIndex(i => i.pag === 4);
      seleccionarItem(initIdx >= 0 ? initIdx : 0);
    };
  </script>
</body>
</html>
