<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>CR-V 2011 - Eléctrico de Carrocería (Body Electrical Sec. 22)</title>
  <style>
    :root {
      --bg-dark: #070913;
      --bg-surface: #0f172a;
      --bg-card: #1e293b;
      --bg-elevated: #334155;
      --body-yellow: #eab308;
      --body-glow: rgba(234, 179, 8, 0.35);
      --cyan: #38bdf8;
      --emerald: #10b981;
      --honda-red: #ef4444;
      --text-bright: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-bright);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* BARRA LATERAL / LISTA */
    #sidebar {
      width: 370px;
      min-width: 300px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 20;
      transition: transform 0.25s ease;
    }

    .brand-header {
      padding: 12px 16px;
      background: #020617;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: var(--body-yellow);
      color: #000;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 4px;
      box-shadow: 0 0 10px var(--body-glow);
    }
    .title h1 { font-size: 0.95rem; font-weight: 700; }
    .title p { font-size: 0.7rem; color: var(--text-muted); }

    .control-box {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-wrap { position: relative; }
    #search {
      width: 100%;
      padding: 9px 12px 9px 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .group-select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--cyan);
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }

    #list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-card {
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    .item-card.active {
      background: rgba(234, 179, 8, 0.2);
      border-color: var(--body-yellow);
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .item-sec { font-size: 0.82rem; font-weight: bold; color: var(--cyan); }
    .item-card.active .item-sec { color: var(--body-yellow); }
    .item-png { font-size: 0.65rem; background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; color: var(--text-muted); }
    .item-title { font-size: 0.8rem; font-weight: 600; margin-bottom: 2px; }
    .item-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.3; }

    /* VISOR */
    #main-viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #020617;
      position: relative;
    }
    #topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .topbar-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tool-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tool-btn.primary {
      background: var(--body-yellow);
      border-color: var(--body-yellow);
      color: #000;
    }

    #stage {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
      background: #020617;
    }
    #sheet-img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      background: #fff;
      transform-origin: top center;
    }

    #toggle-list-btn {
      display: none;
      background: var(--body-yellow);
      color: #000;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      #sidebar {
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
      }
      #sidebar.hidden { transform: translateX(-100%); pointer-events: none; }
      #toggle-list-btn { display: inline-block; }
      #main-viewer { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- BARRA LATERAL -->
  <aside id="sidebar">
    <div class="brand-header">
      <div class="badge">BODY ELEC</div>
      <div class="title">
        <h1>HONDA CR-V 2011</h1>
        <p>Eléctrico de Carrocería (Sección 22)</p>
      </div>
    </div>

    <div class="control-box">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" placeholder="Buscar fusible, tierra G, MICU, seguros, vidrios, faros...">
      </div>

      <select class="group-select" id="group-filter" onchange="filtrarGrupo(this.value)">
        <option value="ALL">⚡ Toda la Carrocería Eléctrica</option>
        <option value="FUSES">🔌 Cajas de Fusibles y Distribución (+B/IG)</option>
        <option value="GROUNDS">⏚ Distribución Maestra de Tierras (G1 - G602)</option>
        <option value="MICU_NET">💻 Módulo MICU y Red Multiplex (B-CAN)</option>
        <option value="DOOR_LOCK">🔒 Seguros Eléctricos, Alarma y Keyless</option>
        <option value="LIGHTS_WIP">💡 Faros, Luces y Limpiaparabrisas</option>
        <option value="GAUGES">📊 Tablero de Instrumentos y Tomacorrientes</option>
      </select>
      <div style="font-size:0.7rem; color:var(--text-muted); display:flex; justify-content:space-between;">
        <span id="counter">0 láminas</span>
        <span id="zoom-label">Zoom: 100%</span>
      </div>
    </div>

    <div id="list-container"></div>
  </aside>

  <!-- ÁREA DE VISUALIZACIÓN -->
  <main id="main-viewer">
    <header id="topbar">
      <div class="topbar-info">
        <button id="toggle-list-btn" onclick="toggleSidebar(true)">☰ Menú Carrocería</button>
        <span id="sheet-title">Página 22-58</span>
        <a id="btn-raw" class="tool-btn primary" href="#" target="_blank">↗ Ver PNG</a>
      </div>
      <div class="toolbar">
        <button class="tool-btn" onclick="zoom(-0.2)">➖ Reducir</button>
        <button class="tool-btn" onclick="zoom(0.2)">➕ Ampliar</button>
        <button class="tool-btn" onclick="zoomReset()">⟲ 100%</button>
        <button class="tool-btn" onclick="nav(-1)">◀ Ant.</button>
        <button class="tool-btn" onclick="nav(1)">Sig. ▶</button>
      </div>
    </header>

    <div id="stage">
      <img id="sheet-img" src="" alt="Lámina Oficial de Eléctrico de Carrocería Honda">
    </div>
  </main>

  <script>
    // BASE DE DATOS ESTRUCTURADA DE BODY ELECTRICAL (SECCIÓN 22 COMPLETA)
    const electricoCarroceria = [
      { grupo: "MICU_NET", sec: "22-1", pag: 1683, titulo: "Precauciones de Seguridad SRS en Carrocería", desc: "Protocolo de 3 minutos tras desconectar batería; no intervenir cableados amarillos con multímetro." },
      { grupo: "MICU_NET", sec: "22-2", pag: 1684, titulo: "Índice de la Sección de Carrocería Eléctrica", desc: "Tabla maestra: Fusibles, tierras, MICU, arneses, seguros, ventanas, limpiaparabrisas y cuadro de mandos." },
      { grupo: "MICU_NET", sec: "22-3", pag: 1685, titulo: "Método de Diagnóstico Eléctrico de 5 Pasos", desc: "Verificación de síntomas, análisis de diagrama, aislamiento de causa, reparación y prueba de conformidad." },
      { grupo: "MICU_NET", sec: "22-5", pag: 1687, titulo: "Código de Colores de Cables Oficial de Honda", desc: "Abreviaturas de colores primarios y secundarios: WHT, BLK, YEL, BLU, RED, GRN, ORN, PNK, BRN, GRY, PUR." },
      { grupo: "FUSES", sec: "22-7", pag: 1689, titulo: "Ubicación de Relevadores en Bahía de Motor", desc: "Relé de compresor A/C, ventiladores, bobinas de ignición, ETCS y relé secundario de inyección PGM-FI." },
      { grupo: "FUSES", sec: "22-13", pag: 1695, titulo: "Índice Maestro de Arneses de la Carrocería", desc: "Mapa de ruteo de los arneses de motor, cabina, piso, techo, puertas y compuerta trasera." },
      { grupo: "FUSES", sec: "22-22", pag: 1704, titulo: "Conectores C301, C401 y Chasis Delantero", desc: "Interconexión del arnés del compartimiento de motor y puntos de derivación hacia el tablero." },
      { grupo: "FUSES", sec: "22-28", pag: 1710, titulo: "Conectores de la Caja de Fusibles del Tablero", desc: "Disposición de sockets C, D, E, F, G, J, K, M, N, P, Q, R, S, T directamente acoplados al MICU." },
      { grupo: "FUSES", sec: "22-33", pag: 1715, titulo: "Conectores de Piso, Consola y Asientos", desc: "Conectores de pretensores de cinturones, calefactores de asiento, sensor Yaw Rate y tierras G551/G552." },
      { grupo: "FUSES", sec: "22-56", pag: 1738, titulo: "Caja de Fusibles de Motor (Under-hood)", desc: "Distribución física de fusibles primarios 1 a 23, bloque multi-fusible de 100A/50A y sensor ELD." },
      { grupo: "FUSES", sec: "22-57", pag: 1739, titulo: "Caja de Fusibles de Cabina (Under-dash)", desc: "Distribución física de los 38 fusibles de protección en el panel lateral del conductor y zócalo MICU." },
      { grupo: "FUSES", sec: "22-58", pag: 1740, titulo: "Distribución de Líneas Batería (+B Directo)", desc: "Esquema eléctrico de alimentación continua sin switch a módulos de memoria, seguros y alarma." },
      { grupo: "FUSES", sec: "22-59", pag: 1741, titulo: "Tabla de Componentes Protegidos: Fusibles 1 a 38", desc: "Asignación detallada de amperajes y circuitos: vidrios (20A), soplador (30A), tomacorrientes (15A)." },
      { grupo: "GROUNDS", sec: "22-61", pag: 1743, titulo: "Índice Maestro de Puntos de Masa (Grounds)", desc: "Tabla técnica completa: Componentes aterrizados a G1, G2, G101, G201, G301, G302, G401, G501-G505, G601, G602." },
      { grupo: "GROUNDS", sec: "22-62", pag: 1744, titulo: "Diagrama de Distribución de Tierras Físicas", desc: "Recorrido esquemático de líneas de retorno para descartar voltajes flotantes y caídas de tensión." },
      { grupo: "FUSES", sec: "22-63", pag: 1745, titulo: "Desmontaje y Montaje de Fusilera de Motor", desc: "Retiro seguro de cables de entrada de batería y conector principal para reemplazo de la caja." },
      { grupo: "FUSES", sec: "22-64", pag: 1746, titulo: "Desmontaje de la Caja de Fusibles de Cabina", desc: "Desacople de palancas de bloqueo del MICU y precauciones para no doblar terminales hembra." },
      { grupo: "FUSES", sec: "22-66", pag: 1748, titulo: "Prueba de Relevadores de 4 y 5 Pines (Relay Test)", desc: "Comprobación de bobina (continuidad) y conmutación de platinos bajo carga de 12V." },
      { grupo: "FUSES", sec: "22-68", pag: 1750, titulo: "Prueba del Switch de Encendido (Ignition Switch)", desc: "Continuidad entre terminales en posiciones OFF (0), ACC (I), ON (II) y START (III). Reemplazo del arnés." },
      { grupo: "MICU_NET", sec: "22-78", pag: 1760, titulo: "Arquitectura de Red B-CAN y Funciones MICU", desc: "Gateway entre F-CAN (500 kbps) y B-CAN (33.33 kbps). Módulos interconectados y wake-up/sleep." },
      { grupo: "DOOR_LOCK", sec: "22-89", pag: 1771, titulo: "Monitoreo en Vivo de Seguros e Interruptores", desc: "Parámetros del Data List en escáner HDS para switch de puerta del piloto, copiloto, traseras y compuerta." },
      { grupo: "DOOR_LOCK", sec: "22-90", pag: 1772, titulo: "Pruebas Activas Bidireccionales del MICU", desc: "Comandos de activación forzada: seguros (0.6 seg), luces (15 seg), limpiadores (5 seg) y claxon (1 seg)." },
      { grupo: "MICU_NET", sec: "22-92", pag: 1774, titulo: "Diagnóstico de Red B-CAN: Modos Test A, C y D", desc: "Procedimiento de prueba cuando un sistema no enciende (Modo D) o no se apaga nunca (Modo C)." },
      { grupo: "DOOR_LOCK", sec: "22-106", pag: 1788, titulo: "Sistema Keyless Entry y Seguros Eléctricos", desc: "Lógica de apertura en 1 toque (piloto) o 2 toques (todas), re-bloqueo automático a los 30 segundos." },
      { grupo: "DOOR_LOCK", sec: "22-113", pag: 1795, titulo: "Diagrama Eléctrico de Seguros y Alarma", desc: "Actuadores de puertas, switch de chapa, actuador de compuerta y bocina de pánico." },
      { grupo: "DOOR_LOCK", sec: "22-132", pag: 1814, titulo: "Prueba de Entradas del MICU: Seguros de Puertas", desc: "Comprobación de voltaje en zócalo T: <1V en reposo, >5V accionado para diagnosticar switch dañado." },
      { grupo: "LIGHTS_WIP", sec: "22-146", pag: 1828, titulo: "Diagrama Eléctrico de Faros Principales", desc: "Luz baja y luz alta gobernados por el MICU, relevador de cuartos y control de luces diurnas (DRL)." },
      { grupo: "LIGHTS_WIP", sec: "22-160", pag: 1842, titulo: "Diagrama de Direccionales y Luces de Emergencia", desc: "Control electrónico del destellador integrado en el MICU y switch de intermitentes." },
      { grupo: "LIGHTS_WIP", sec: "22-176", pag: 1858, titulo: "Diagrama de Luces Interiores y Plafones", desc: "Temporizador de luz de cortesía con atenuación progresiva al cerrar puertas o colocar llave." },
      { grupo: "DOOR_LOCK", sec: "22-190", pag: 1872, titulo: "Diagrama Eléctrico de Elevalunas (Power Windows)", desc: "Mando maestro del conductor, auto-subida/bajada con función antipinzamiento y corte de ventana." },
      { grupo: "LIGHTS_WIP", sec: "22-203", pag: 1885, titulo: "Diagrama de Limpiaparabrisas Delantero y Trasero", desc: "Velocidades intermitente variable, baja, alta y motor lavador operados por relevador y MICU." },
      { grupo: "GAUGES", sec: "22-231", pag: 1913, titulo: "Autodiagnóstico Manual del Tablero (SEL/RESET)", desc: "Protocolo de barrido de agujas y prueba de testigos sin escáner: SEL/RESET + Faros ON/OFF + 3 clics." },
      { grupo: "GAUGES", sec: "22-232", pag: 1914, titulo: "Diagrama Eléctrico del Cuadro de Instrumentos", desc: "Líneas de alimentación bajo switch IG1 (No. 10), respaldo constante (No. 23) y F-CAN/B-CAN." },
      { grupo: "GAUGES", sec: "22-263", pag: 1945, titulo: "Diagrama de Tomacorrientes de 12V (Accessory Sockets)", desc: "Relés de accesorios frontal, de consola y de maletero protegidos con fusibles 28, 29, 31 y masa G502." },
      { grupo: "GAUGES", sec: "22-273", pag: 1955, titulo: "Diagrama y Prueba de Espejos Eléctricos", desc: "Mando de regulación izquierda/derecha y desempañador térmico de lunas de espejo." },
      { grupo: "MICU_NET", sec: "22-288", pag: 1970, titulo: "Diagrama del Sistema Inmovilizador y Transponder", desc: "Receptor de anillo en switch de encendido, señal S-NET a la PCM y comunicación con llave maestra." }
    ];

    let itemsFiltrados = [...electricoCarroceria];
    let indiceActual = 0;
    let zoomLevel = 1.0;

    function renderLista() {
      const cont = document.getElementById('list-container');
      cont.innerHTML = '';
      document.getElementById('counter').textContent = `${itemsFiltrados.length} láminas técnicas`;

      itemsFiltrados.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `item-card ${idx === indiceActual ? 'active' : ''}`;
        div.id = `item-${idx}`;
        div.innerHTML = `
          <div class="item-top">
            <span class="item-sec">Sec. ${item.sec}</span>
            <span class="item-png">pag_${item.pag}.png</span>
          </div>
          <div class="item-title">${item.titulo}</div>
          <div class="item-desc">${item.desc}</div>
        `;
        div.onclick = () => {
          seleccionarItem(idx);
          toggleSidebar(false);
        };
        cont.appendChild(div);
      });
    }

    function seleccionarItem(idx) {
      if (idx < 0 || idx >= itemsFiltrados.length) return;
      indiceActual = idx;
      const item = itemsFiltrados[idx];

      document.getElementById('sheet-title').textContent = `Sec. ${item.sec} • Pág. ${item.pag}`;
      const img = document.getElementById('sheet-img');
      const rawUrl = `https://raw.githubusercontent.com/HeberDaniel85/crv-manual-2011/main/imagenes/pag_${item.pag}.png`;
      img.src = rawUrl;
      document.getElementById('btn-raw').href = rawUrl;

      document.querySelectorAll('.item-card').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`item-${idx}`);
      if (activeEl) {
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      zoomReset();
    }

    function nav(delta) {
      seleccionarItem(indiceActual + delta);
    }

    function zoom(delta) {
      zoomLevel = Math.max(0.6, Math.min(3.0, zoomLevel + delta));
      document.getElementById('sheet-img').style.transform = `scale(${zoomLevel})`;
      document.getElementById('zoom-label').textContent = `Zoom: ${Math.round(zoomLevel * 100)}%`;
    }

    function zoomReset() {
      zoomLevel = 1.0;
      document.getElementById('sheet-img').style.transform = `scale(1)`;
      document.getElementById('zoom-label').textContent = `Zoom: 100%`;
    }

    function toggleSidebar(show) {
      const sb = document.getElementById('sidebar');
      if (show) sb.classList.remove('hidden');
      else sb.classList.add('hidden');
    }

    function filtrarGrupo(sub) {
      if (sub === 'ALL') {
        itemsFiltrados = [...electricoCarroceria];
      } else {
        itemsFiltrados = electricoCarroceria.filter(i => i.grupo === sub);
      }
      indiceActual = 0;
      renderLista();
      seleccionarItem(0);
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        itemsFiltrados = [...electricoCarroceria];
      } else {
        itemsFiltrados = electricoCarroceria.filter(i => 
          i.sec.toLowerCase().includes(q) ||
          i.pag.toString() === q ||
          i.titulo.toLowerCase().includes(q) ||
          i.desc.toLowerCase().includes(q)
        );
      }
      indiceActual = 0;
      renderLista();
      if (itemsFiltrados.length > 0) seleccionarItem(0);
    });

    window.onload = () => {
      renderLista();
      // Carga directa de la lámina maestra de fusibles de cabina (Pág. 1740 / Sec. 22-58)
      const initIdx = electricoCarroceria.findIndex(i => i.pag === 1740);
      seleccionarItem(initIdx >= 0 ? initIdx : 0);
    };
  </script>
</body>
</html>
