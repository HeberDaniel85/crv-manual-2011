<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>CR-V 2011 - Mecánica del Motor K24Z1</title>
  <style>
    :root {
      --bg-dark: #080c14;
      --bg-surface: #0f172a;
      --bg-card: #1e293b;
      --bg-elevated: #334155;
      --honda-red: #dc2626;
      --amber: #f59e0b;
      --emerald: #10b981;
      --cyan: #38bdf8;
      --text-bright: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-bright);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* BARRA LATERAL / LISTA */
    #sidebar {
      width: 370px;
      min-width: 300px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 20;
      transition: transform 0.25s ease;
    }

    .brand-header {
      padding: 12px 16px;
      background: #020617;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: var(--honda-red);
      color: white;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .title h1 { font-size: 0.95rem; font-weight: 700; }
    .title p { font-size: 0.7rem; color: var(--text-muted); }

    .control-box {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-wrap { position: relative; }
    #search {
      width: 100%;
      padding: 9px 12px 9px 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .group-select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--cyan);
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }

    #list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-card {
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    .item-card.active {
      background: rgba(220, 38, 38, 0.2);
      border-color: var(--honda-red);
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .item-sec { font-size: 0.82rem; font-weight: bold; color: var(--cyan); }
    .item-card.active .item-sec { color: var(--honda-red); }
    .item-png { font-size: 0.65rem; background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; color: var(--text-muted); }
    .item-title { font-size: 0.8rem; font-weight: 600; margin-bottom: 2px; }
    .item-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.3; }

    /* VISOR */
    #main-viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #020617;
      position: relative;
    }
    #topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .topbar-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tool-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tool-btn.primary {
      background: var(--honda-red);
      border-color: var(--honda-red);
    }

    #stage {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
      background: #020617;
    }
    #sheet-img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      background: #fff;
      transform-origin: top center;
    }

    #toggle-list-btn {
      display: none;
      background: var(--honda-red);
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      #sidebar {
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
      }
      #sidebar.hidden { transform: translateX(-100%); pointer-events: none; }
      #toggle-list-btn { display: inline-block; }
      #main-viewer { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- BARRA LATERAL -->
  <aside id="sidebar">
    <div class="brand-header">
      <div class="badge">K24Z1</div>
      <div class="title">
        <h1>HONDA CR-V 2011</h1>
        <p>Mecánica del Motor (Engine Mechanical)</p>
      </div>
    </div>

    <div class="control-box">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" placeholder="Buscar cadena, culata, pistón, torque, biela...">
      </div>

      <select class="group-select" id="group-filter" onchange="filtrarGrupo(this.value)">
        <option value="ALL">🔧 Toda la Mecánica del Motor</option>
        <option value="ASSEMBLY">📦 Conjunto Motor y Soportes (Sec. 5)</option>
        <option value="HEAD">⚙️ Culata y Distribución (Sec. 6)</option>
        <option value="BLOCK">🔩 Bloque de Cilindros y Cárter (Sec. 7)</option>
        <option value="LUBRICATION">🛢️ Lubricación y Bomba Aceite (Sec. 8)</option>
      </select>
      <div style="font-size:0.7rem; color:var(--text-muted); display:flex; justify-content:space-between;">
        <span id="counter">0 láminas</span>
        <span id="zoom-label">Zoom: 100%</span>
      </div>
    </div>

    <div id="list-container"></div>
  </aside>

  <!-- ÁREA DE VISUALIZACIÓN -->
  <main id="main-viewer">
    <header id="topbar">
      <div class="topbar-info">
        <button id="toggle-list-btn" onclick="toggleSidebar(true)">☰ Menú Mecánico</button>
        <span id="sheet-title">Página 6-16</span>
        <a id="btn-raw" class="tool-btn primary" href="#" target="_blank">↗ Ver PNG</a>
      </div>
      <div class="toolbar">
        <button class="tool-btn" onclick="zoom(-0.2)">➖ Reducir</button>
        <button class="tool-btn" onclick="zoom(0.2)">➕ Ampliar</button>
        <button class="tool-btn" onclick="zoomReset()">⟲ 100%</button>
        <button class="tool-btn" onclick="nav(-1)">◀ Ant.</button>
        <button class="tool-btn" onclick="nav(1)">Sig. ▶</button>
      </div>
    </header>

    <div id="stage">
      <img id="sheet-img" src="" alt="Lámina Mecánica Oficial Honda">
    </div>
  </main>

  <script>
    // BASE DE DATOS ESTRUCTURADA DE MECÁNICA DE MOTOR K24Z1 (SECCIONES 5, 6, 7 Y 8)
    const mecanicaMotor = [

      { grupo: "ASSEMBLY", sec: "5-3", pag: 89, titulo: "Desmontaje del Conjunto Motor (Paso 1-9)", desc: "Despresurización de combustible, batería, arneses y fusilera." },
      { grupo: "ASSEMBLY", sec: "5-5", pag: 91, titulo: "Drenado de Fluidos y Desconexión Inferior", desc: "Drenado de refrigerante, aceite de motor y ATF. Retiro de catalizador." },
      { grupo: "ASSEMBLY", sec: "5-7", pag: 93, titulo: "Compresor A/C y Radiador", desc: "Desmontaje de compresor A/C sin desconectar mangueras y retiro de radiador." },

      { grupo: "ASSEMBLY", sec: "5-14", pag: 100, titulo: "Instalación del Conjunto y Soporte Lateral", desc: "Perno y tuerca de montaje lateral 14x1.5mm: 74 N·m (54 lbf·ft)." },
      { grupo: "ASSEMBLY", sec: "5-15", pag: 101, titulo: "Instalación del Soporte de Transmisión", desc: "Pernos de soporte 12x1.25mm: 64 N·m y 74 N·m. Subframe: 103 N·m." },
      { grupo: "ASSEMBLY", sec: "5-16", pag: 102, titulo: "Tirante de Torque Inferior (Lower Torque Rod)", desc: "Secuencia de apriete: Perno 1 (14mm) 93 N·m, Perno 2 (12mm) 88 N·m." },

      { grupo: "HEAD", sec: "6-2", pag: 118, titulo: "Herramientas Especiales: Culata y Válvulas", desc: "Traba de polea de cigüeñal 070AB-RJA0100, compresor de resortes y adaptadores VTEC." },
      { grupo: "HEAD", sec: "6-3", pag: 119, titulo: "Ubicación de Componentes: Distribución", desc: "Cadena de tiempo, tensor hidráulico, guías A y B, sensor CKP y solenoide VTC." },
      { grupo: "HEAD", sec: "6-4", pag: 120, titulo: "Ubicación de Árboles y Balancines", desc: "Actuador VTC, sprockets, sensores CMP A/B y ensamble de balancines." },
      { grupo: "HEAD", sec: "6-5", pag: 121, titulo: "Despiece de Válvulas y Resortes", desc: "Sellos de válvula de admisión y escape, retenedores, cuñas y solenoide VTEC." },

      { grupo: "LUBRICATION", sec: "8-16", pag: 218, titulo: "Tolerancias de Rotores de Bomba de Aceite", desc: "Luz rotor interno-externo máx: 0.20 mm. Luz axial máx: 0.12 mm." },
      { grupo: "LUBRICATION", sec: "8-17", pag: 219, titulo: "Inspección de Ejes Balanceadores", desc: "Juego axial ejes delantero y trasero: 0.063-0.108 mm (Límite 0.14 mm)." },
      { grupo: "LUBRICATION", sec: "8-21", pag: 223, titulo: "Sincronización e Instalación de Bomba de Aceite", desc: "Traba de 6 mm en orificio de servicio, pernos de bomba: 44 N·m (33 lbf·ft)." }
    ];

    let itemsFiltrados = [...mecanicaMotor];
    let indiceActual = 0;
    let zoomLevel = 1.0;

    function renderLista() {
      const cont = document.getElementById('list-container');
      cont.innerHTML = '';
      document.getElementById('counter').textContent = `${itemsFiltrados.length} láminas técnicas`;

      itemsFiltrados.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `item-card ${idx === indiceActual ? 'active' : ''}`;
        div.id = `item-${idx}`;
        div.innerHTML = `
          <div class="item-top">
            <span class="item-sec">Sec. ${item.sec}</span>
            <span class="item-png">pag_${item.pag}.png</span>
          </div>
          <div class="item-title">${item.titulo}</div>
          <div class="item-desc">${item.desc}</div>
        `;
        div.onclick = () => {
          seleccionarItem(idx);
          toggleSidebar(false);
        };
        cont.appendChild(div);
      });
    }

    function seleccionarItem(idx) {
      if (idx < 0 || idx >= itemsFiltrados.length) return;
      indiceActual = idx;
      const item = itemsFiltrados[idx];

      document.getElementById('sheet-title').textContent = `Sec. ${item.sec} • Pág. ${item.pag}`;
      const img = document.getElementById('sheet-img');
      const rawUrl = `https://raw.githubusercontent.com/HeberDaniel85/crv-manual-2011/main/imagenes/pag_${item.pag}.png`;
      img.src = rawUrl;
      document.getElementById('btn-raw').href = rawUrl;

      document.querySelectorAll('.item-card').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`item-${idx}`);
      if (activeEl) {
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      zoomReset();
    }

    function nav(delta) {
      seleccionarItem(indiceActual + delta);
    }

    function zoom(delta) {
      zoomLevel = Math.max(0.6, Math.min(3.0, zoomLevel + delta));
      document.getElementById('sheet-img').style.transform = `scale(${zoomLevel})`;
      document.getElementById('zoom-label').textContent = `Zoom: ${Math.round(zoomLevel * 100)}%`;
    }

    function zoomReset() {
      zoomLevel = 1.0;
      document.getElementById('sheet-img').style.transform = `scale(1)`;
      document.getElementById('zoom-label').textContent = `Zoom: 100%`;
    }

    function toggleSidebar(show) {
      const sb = document.getElementById('sidebar');
      if (show) sb.classList.remove('hidden');
      else sb.classList.add('hidden');
    }

    function filtrarGrupo(sub) {
      if (sub === 'ALL') {
        itemsFiltrados = [...mecanicaMotor];
      } else {
        itemsFiltrados = mecanicaMotor.filter(i => i.grupo === sub);
      }
      indiceActual = 0;
      renderLista();
      seleccionarItem(0);
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        itemsFiltrados = [...mecanicaMotor];
      } else {
        itemsFiltrados = mecanicaMotor.filter(i => 
          i.sec.toLowerCase().includes(q) ||
          i.pag.toString() === q ||
          i.titulo.toLowerCase().includes(q) ||
          i.desc.toLowerCase().includes(q)
        );
      }
      indiceActual = 0;
      renderLista();
      if (itemsFiltrados.length > 0) seleccionarItem(0);
    });

    window.onload = () => {
      renderLista();
      // Abre por defecto en la sincronización de la cadena de tiempo (Pág. 132 / Sec. 6-16)
      const initIdx = mecanicaMotor.findIndex(i => i.pag === 132);
      seleccionarItem(initIdx >= 0 ? initIdx : 0);
    };
  </script>
</body>
</html>
