<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>CR-V 2011 - Dirección Hidráulica (Power Steering)</title>
  <style>
    :root {
      --bg-dark: #070b14;
      --bg-surface: #0f172a;
      --bg-card: #1e293b;
      --bg-elevated: #334155;
      --ps-amber: #eab308;
      --ps-glow: rgba(234, 179, 8, 0.35);
      --cyan: #38bdf8;
      --emerald: #10b981;
      --text-bright: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-bright);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* BARRA LATERAL / LISTA */
    #sidebar {
      width: 370px;
      min-width: 300px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 20;
      transition: transform 0.25s ease;
    }

    .brand-header {
      padding: 12px 16px;
      background: #020617;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: var(--ps-amber);
      color: #000;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 4px;
      box-shadow: 0 0 10px var(--ps-glow);
    }
    .title h1 { font-size: 0.95rem; font-weight: 700; }
    .title p { font-size: 0.7rem; color: var(--text-muted); }

    .control-box {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-wrap { position: relative; }
    #search {
      width: 100%;
      padding: 9px 12px 9px 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .group-select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--cyan);
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
    }

    #list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-card {
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    .item-card.active {
      background: rgba(234, 179, 8, 0.2);
      border-color: var(--ps-amber);
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .item-sec { font-size: 0.82rem; font-weight: bold; color: var(--cyan); }
    .item-card.active .item-sec { color: var(--ps-amber); }
    .item-png { font-size: 0.65rem; background: rgba(255,255,255,0.08); padding: 2px 5px; border-radius: 4px; color: var(--text-muted); }
    .item-title { font-size: 0.8rem; font-weight: 600; margin-bottom: 2px; }
    .item-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.3; }

    /* VISOR */
    #main-viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #020617;
      position: relative;
    }
    #topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .topbar-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tool-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tool-btn.primary {
      background: var(--ps-amber);
      border-color: var(--ps-amber);
      color: #000;
    }

    #stage {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
      background: #020617;
    }
    #sheet-img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      background: #fff;
      transform-origin: top center;
    }

    #toggle-list-btn {
      display: none;
      background: var(--ps-amber);
      color: #000;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    @media (max-width: 768px) {
      #sidebar {
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
      }
      #sidebar.hidden { transform: translateX(-100%); pointer-events: none; }
      #toggle-list-btn { display: inline-block; }
      #main-viewer { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- BARRA LATERAL -->
  <aside id="sidebar">
    <div class="brand-header">
      <div class="badge">STEERING</div>
      <div class="title">
        <h1>HONDA CR-V 2011</h1>
        <p>Dirección Hidráulica (Sección 17)</p>
      </div>
    </div>

    <div class="control-box">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="search" placeholder="Buscar bomba, cremallera, switch PSP, fluido, torque...">
      </div>

      <select class="group-select" id="group-filter" onchange="filtrarGrupo(this.value)">
        <option value="ALL">☸️ Toda la Dirección Hidráulica</option>
        <option value="PUMP">🔄 Bomba Hidráulica (Bomba y Despiece)</option>
        <option value="GEARBOX">🔩 Cremallera (Gearbox y Ajuste Rack)</option>
        <option value="LINES">🛢️ Líneas, Mangueras y Switch PSP</option>
        <option value="COLUMN">🚗 Volante, Columna y Precaución SRS</option>
        <option value="DIAG">🔍 Pruebas de Presión y Diagnóstico</option>
      </select>
      <div style="font-size:0.7rem; color:var(--text-muted); display:flex; justify-content:space-between;">
        <span id="counter">0 láminas</span>
        <span id="zoom-label">Zoom: 100%</span>
      </div>
    </div>

    <div id="list-container"></div>
  </aside>

  <!-- ÁREA DE VISUALIZACIÓN -->
  <main id="main-viewer">
    <header id="topbar">
      <div class="topbar-info">
        <button id="toggle-list-btn" onclick="toggleSidebar(true)">☰ Menú Dirección</button>
        <span id="sheet-title">Página 17-15</span>
        <a id="btn-raw" class="tool-btn primary" href="#" target="_blank">↗ Ver PNG</a>
      </div>
      <div class="toolbar">
        <button class="tool-btn" onclick="zoom(-0.2)">➖ Reducir</button>
        <button class="tool-btn" onclick="zoom(0.2)">➕ Ampliar</button>
        <button class="tool-btn" onclick="zoomReset()">⟲ 100%</button>
        <button class="tool-btn" onclick="nav(-1)">◀ Ant.</button>
        <button class="tool-btn" onclick="nav(1)">Sig. ▶</button>
      </div>
    </header>

    <div id="stage">
      <img id="sheet-img" src="" alt="Lámina Oficial de Dirección Honda">
    </div>
  </main>

  <script>
    // BASE DE DATOS ESTRUCTURADA DE POWER STEERING (SECCIÓN 17)
    const direccionHidraulica = [
      { grupo: "COLUMN", sec: "17-1", pag: 1165, titulo: "Precauciones de Seguridad SRS en Dirección", desc: "Desconexión de batería y precauciones para no detonar bolsa de aire al desmontar volante." },
      { grupo: "DIAG", sec: "17-2", pag: 1166, titulo: "Índice de la Sección y Herramientas Especiales", desc: "Llave de 40 mm 07MAA-SL00100, extractor de rótulas 07MAC-SL0A202 y sujetador de polea." },
      { grupo: "LINES", sec: "17-3", pag: 1168, titulo: "Ubicación de Componentes de Dirección (General)", desc: "Bomba, depósito, cremallera, manguera de alta presión y switch de presión PSP." },
      { grupo: "DIAG", sec: "17-4", pag: 1169, titulo: "Diagnóstico de Síntomas: Dirección Dura o con Ruido", desc: "Revisión de banda floja, aire en el sistema, zumbidos normales en frío y fugas." },
      { grupo: "DIAG", sec: "17-6", pag: 1171, titulo: "Diagnóstico de Esfuerzo de Dirección Dura", desc: "Carga inicial límite: 34 N (7.7 lbf). Prueba con manómetro en ralentí (máx 213 psi)." },
      { grupo: "DIAG", sec: "17-7", pag: 1172, titulo: "Juego Libre de Volante y Fuerza Asistida", desc: "Juego libre: 0-10 mm. Prueba con dinamómetro de resorte en piso seco." },
      { grupo: "DIAG", sec: "17-9", pag: 1174, titulo: "Prueba de Presión de Bomba (07406-0010001)", desc: "Presión de alivio en ralentí: 7,350 a 8,050 kPa (1,070 a 1,170 psi). Válvula cerrada máx 5 seg." },
      { grupo: "DIAG", sec: "17-10", pag: 1175, titulo: "Prueba de Presión con Manómetro 07406-001000A", desc: "Procedimiento alterno con adaptadores 07ZAK-S7C0100 y 07ZAK-S7C0200." },
      { grupo: "LINES", sec: "17-11", pag: 1176, titulo: "Inspección de Fugas en Bomba, Cremallera y Líneas", desc: "Puntos clave de fuga: retenes de cremallera, acoples flare nut y sello de eje de bomba." },
      { grupo: "LINES", sec: "17-12", pag: 1177, titulo: "Vaciado, Llenado y Purga de Fluido PSF", desc: "Usar solo Honda Genuine PSF. Capacidad en despiece: 0.99 L, depósito: 0.29 L." },
      { grupo: "LINES", sec: "17-13", pag: 1178, titulo: "Líneas, Mangueras y Switch de Presión PSP", desc: "Switch PSP: 12 N·m. Línea de entrada 18x1.5mm: 47 N·m. Línea de retorno 16x1.5mm: 28 N·m." },
      { grupo: "PUMP", sec: "17-14", pag: 1179, titulo: "Desmontaje y Montaje de la Bomba de Dirección", desc: "Pernos de soporte: 22 N·m (16 lbf·ft). Brida de manguera de alta presión (6mm): 11 N·m." },
      { grupo: "PUMP", sec: "17-15", pag: 1180, titulo: "Despiece Completo de la Bomba de Dirección (Overhaul)", desc: "Tuerca de polea: 64 N·m. Tapa trasera: 20 N·m. Tapón válvula control: 49 N·m. Tapón cuerpo: 29 N·m." },
      { grupo: "PUMP", sec: "17-21", pag: 1186, titulo: "Armado Final de la Bomba y Apriete de Polea", desc: "Instalación de O-rings nuevos con PSF, toma de entrada (11 N·m) y giro suave de polea." },
      { grupo: "COLUMN", sec: "17-22", pag: 1187, titulo: "Desmontaje del Volante de Conducción", desc: "Uso de extractor con jam nuts a 5 hilos máximo para no romper el carrete de cable (Cable Reel)." },
      { grupo: "COLUMN", sec: "17-24", pag: 1189, titulo: "Instalación y Alineación del Volante", desc: "Perno central de volante: 39 N·m (29 lbf·ft). Centrado de ruedas rectas." },
      { grupo: "COLUMN", sec: "17-25", pag: 1190, titulo: "Desmontaje de la Columna de Dirección", desc: "Articulación inferior, pernos de seguridad de cizallamiento y arnés de encendido." },
      { grupo: "GEARBOX", sec: "17-31", pag: 1196, titulo: "Ajuste de la Guía de Cremallera (Rack Guide)", desc: "Perno guía a 25 N·m, aflojar, re-apretar a 7.8 N·m y regresar 10° ± 5°. Contratuerca 40mm: +30°." },
      { grupo: "GEARBOX", sec: "17-32", pag: 1197, titulo: "Desmontaje de la Cremallera del Vehículo (Paso 1)", desc: "Drenado, desacople de articulación de columna, rótulas de dirección con útil 07MAC-SL0A202." },
      { grupo: "GEARBOX", sec: "17-33", pag: 1198, titulo: "Desconexión de Líneas y Protector Térmico", desc: "Tuerca flare nut de 18 mm, manguera de retorno y retiro de soporte de caja de dirección." },
      { grupo: "GEARBOX", sec: "17-34", pag: 1199, titulo: "Pernos de Soporte de Cremallera y Barra Estabilizadora", desc: "Pernos 10 mm de cremallera, soportes de buje de barra estabilizadora (pernos 8 mm)." },
      { grupo: "GEARBOX", sec: "17-35", pag: 1200, titulo: "Extracción de la Cremallera por Salpicadera Izquierda", desc: "Girar eje del piñón hacia atrás y deslizar conjunto completo por el paso de rueda del conductor." },
      { grupo: "GEARBOX", sec: "17-36", pag: 1201, titulo: "Despiece Completo de la Cremallera (Exploded View)", desc: "Sellos de cilindro, tuercas de línea (25 N·m), rótulas axiales (rack ends), bujes y retén." },
      { grupo: "GEARBOX", sec: "17-37", pag: 1202, titulo: "Desarmado de Terminales Axiales (Rack Ends)", desc: "Desdoblar arandelas de seguridad y sujetar caras planas de cremallera con llave." },
      { grupo: "GEARBOX", sec: "17-39", pag: 1204, titulo: "Extracción del Pistón y Retén Interno de Cilindro", desc: "Perforar punto de remache a 3 mm x 2.5 mm de profundidad para liberar tapa de cilindro." },
      { grupo: "GEARBOX", sec: "17-47", pag: 1212, titulo: "Instalación de Retén Interno y Cremallera", desc: "Útil deslizador 07LAG-SM40300 lubricado con PSF y grasa especial de cremallera en dientes." },
      { grupo: "GEARBOX", sec: "17-48", pag: 1213, titulo: "Instalación de Tapa de Cilindro y Remachado", desc: "Apretar extremo de cilindro a 69 N·m (51 lbf·ft) y punzonar/remachar en el borde nuevo." },
      { grupo: "GEARBOX", sec: "17-52", pag: 1217, titulo: "Instalación de la Cremallera en el Chasis", desc: "Torque pernos de montaje 10x1.25mm: 59 N·m (43 lbf·ft). Conexión de articulación con perno nuevo." },
      { grupo: "GEARBOX", sec: "17-57", pag: 1222, titulo: "Reemplazo de Cubrepolvos de Rótula (Tie-Rod Boot)", desc: "Inspección de grasa y sujeción de arillos de fijación sin rasgar la goma." }
    ];

    let itemsFiltrados = [...direccionHidraulica];
    let indiceActual = 0;
    let zoomLevel = 1.0;

    function renderLista() {
      const cont = document.getElementById('list-container');
      cont.innerHTML = '';
      document.getElementById('counter').textContent = `${itemsFiltrados.length} láminas técnicas`;

      itemsFiltrados.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `item-card ${idx === indiceActual ? 'active' : ''}`;
        div.id = `item-${idx}`;
        div.innerHTML = `
          <div class="item-top">
            <span class="item-sec">Sec. ${item.sec}</span>
            <span class="item-png">pag_${item.pag}.png</span>
          </div>
          <div class="item-title">${item.titulo}</div>
          <div class="item-desc">${item.desc}</div>
        `;
        div.onclick = () => {
          seleccionarItem(idx);
          toggleSidebar(false);
        };
        cont.appendChild(div);
      });
    }

    function seleccionarItem(idx) {
      if (idx < 0 || idx >= itemsFiltrados.length) return;
      indiceActual = idx;
      const item = itemsFiltrados[idx];

      document.getElementById('sheet-title').textContent = `Sec. ${item.sec} • Pág. ${item.pag}`;
      const img = document.getElementById('sheet-img');
      const rawUrl = `https://raw.githubusercontent.com/HeberDaniel85/crv-manual-2011/main/imagenes/pag_${item.pag}.png`;
      img.src = rawUrl;
      document.getElementById('btn-raw').href = rawUrl;

      document.querySelectorAll('.item-card').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`item-${idx}`);
      if (activeEl) {
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      zoomReset();
    }

    function nav(delta) {
      seleccionarItem(indiceActual + delta);
    }

    function zoom(delta) {
      zoomLevel = Math.max(0.6, Math.min(3.0, zoomLevel + delta));
      document.getElementById('sheet-img').style.transform = `scale(${zoomLevel})`;
      document.getElementById('zoom-label').textContent = `Zoom: ${Math.round(zoomLevel * 100)}%`;
    }

    function zoomReset() {
      zoomLevel = 1.0;
      document.getElementById('sheet-img').style.transform = `scale(1)`;
      document.getElementById('zoom-label').textContent = `Zoom: 100%`;
    }

    function toggleSidebar(show) {
      const sb = document.getElementById('sidebar');
      if (show) sb.classList.remove('hidden');
      else sb.classList.add('hidden');
    }

    function filtrarGrupo(sub) {
      if (sub === 'ALL') {
        itemsFiltrados = [...direccionHidraulica];
      } else {
        itemsFiltrados = direccionHidraulica.filter(i => i.grupo === sub);
      }
      indiceActual = 0;
      renderLista();
      seleccionarItem(0);
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        itemsFiltrados = [...direccionHidraulica];
      } else {
        itemsFiltrados = direccionHidraulica.filter(i => 
          i.sec.toLowerCase().includes(q) ||
          i.pag.toString() === q ||
          i.titulo.toLowerCase().includes(q) ||
          i.desc.toLowerCase().includes(q)
        );
      }
      indiceActual = 0;
      renderLista();
      if (itemsFiltrados.length > 0) seleccionarItem(0);
    });

    window.onload = () => {
      renderLista();
      // Lukatan a dagus iti despiece ti bomba (Pág. 1180 / Sec. 17-15)
      const initIdx = direccionHidraulica.findIndex(i => i.pag === 1180);
      seleccionarItem(initIdx >= 0 ? initIdx : 0);
    };
  </script>
</body>
</html>
